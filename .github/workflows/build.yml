name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - name: Resolve dependencies
        working-directory: server
        run: go mod tidy
      - name: Test
        working-directory: server
        run: go test ./...
      - name: Build Linux x64 server
        working-directory: server
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/cslvpn-server ./cmd/cslvpn-server
      - uses: actions/upload-artifact@v4
        with:
          name: cslvpn-server-linux-x64
          path: server/dist/cslvpn-server
          if-no-files-found: error
          retention-days: 30

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build service
        run: dotnet build .\client\src\CSLVpn.Service\CSLVpn.Service.csproj -c Release
      - name: Build tray
        run: dotnet build .\client\src\CSLVpn.Tray\CSLVpn.Tray.csproj -c Release
      - name: Publish Windows x64 service
        run: dotnet publish .\client\src\CSLVpn.Service\CSLVpn.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\service
      - name: Publish Windows x64 tray
        run: dotnet publish .\client\src\CSLVpn.Tray\CSLVpn.Tray.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\tray
      - uses: actions/upload-artifact@v4
        with:
          name: cslvpn-windows-x64
          path: .\artifacts
          if-no-files-found: error
          retention-days: 30
